<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRACE//VEHICLE</title><style>body{font-family:Arial,sans-serif;background:#0b0d10;color:#f5f7fa;margin:0}main{max-width:1000px;margin:auto;padding:40px}.card{background:#15191f;border:1px solid #2b323c;border-radius:18px;padding:22px;margin:16px 0}.ok{color:#55d68b}.warn{color:#ffca58}code{background:#090b0d;padding:3px 7px;border-radius:6px}input,button{padding:12px;border-radius:9px;border:1px solid #39414d;background:#0d1117;color:white;margin:5px}button{cursor:pointer}#result{white-space:pre-wrap}</style></head><body><main><h1>TRACE//VEHICLE</h1><p>Authorized Multi-Source Vehicle Location Platform</p><div class="card"><b>Production rule</b><p class="warn">VIN/ナンバーだけで位置を生成しません。認証済みConnectorまたは適法な観測データのみ表示します。</p></div><div class="card"><h2>Case</h2><input id="caseId" placeholder="Case UUID"><button onclick="latest()">LAST LOCATION</button><div id="result"></div></div><div class="card"><h2>Connector status</h2><p>PAT / API Key / OAuth はサーバー側Secretのみ。ブラウザへ配布しません。</p><p class="ok">✓ Legal-basis gate　✓ Audit-ready architecture　✓ Real-provider adapter slot</p></div></main><script>async function latest(){let id=document.getElementById('caseId').value;let r=await fetch('/api/cases/'+encodeURIComponent(id)+'/last-location');document.getElementById('result').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
